<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent AI</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #1f2937 0%, #111827 40%, #030712 100%);
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 16px 24px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        color: #f9fafb;
      }

      .logo-badge {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: linear-gradient(135deg, #22d3ee, #6366f1);
      }

      .logo-text {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="logo" aria-label="Logo Agent AI">
      <div class="logo-badge">AI</div>
      <div class="logo-text">Agent AI</div>
    </div>
  </body>
</html>
